name: Сборка

on:
  push:
    # Выпуск: ветка release/<android|windows|win7>/vX.Y.Z — собирается и выпускается только эта платформа.
    branches: [main, 'release/*/v*']
    paths-ignore:
      - '**.md'
      - 'catalog/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: APK (arm64-v8a)
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/android/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия
        run: |
          source tools/ci_version.sh
          mkdir -p report
          { echo "Лоцман $VERSION ($CODE)"; flutter --version; java -version 2>&1; } | tee report/versions.txt

      - name: Кэш ядра и TUN-моста
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libv2ray.aar
            android/app/src/main/jniLibs
          key: natives-${{ env.NDK_VERSION }}-${{ hashFiles('tools/fetch_natives.sh', 'tools/hev-udp-bind.patch', 'tools/natives.sha256') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро Xray и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_natives.sh

      - name: Ядро сверяется с закреплённой контрольной суммой (и из кэша тоже)
        run: sha256sum -c tools/natives.sha256

      - name: Платформенные файлы Flutter
        run: |
          flutter create --org app --project-name locman --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py > report/gradle-patch.txt
          cp catalog/catalog.json assets/catalog.json
          python3 tools/changelog.py "$VERSION" release-notes/android.txt

      - name: Анализ кода
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee report/analyze.txt

      - name: Тесты
        run: |
          set -o pipefail
          flutter test 2>&1 | tee report/tests.txt
          mkdir -p report/look && cp build/look/*.png report/look/ 2>/dev/null || true

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCMAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOCMAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LOCMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "LOCMAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Подпись: ключ релиза"
          else
            echo "Подпись: отладочный ключ (секретов нет)"
            if [ "${RELEASE:-}" = 1 ]; then echo "::error::Релиз без ключа подписи выпускать нельзя"; exit 1; fi
          fi

      - name: Сборка APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$VERSION" --build-number "$CODE" 2>&1 | tee report/build.txt

      - name: Проверка APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          listing="$(unzip -l "$APK")"
          echo "$listing" | grep -E 'lib/' | awk '{print $1, $4}' | tee report/libs.txt
          for lib in libgojni.so libhev-socks5-tunnel.so libflutter.so libapp.so; do
            grep -q "lib/arm64-v8a/$lib" <<<"$listing" || { echo "::error::В APK нет $lib"; exit 1; }
          done
          dex="$(unzip -p "$APK" 'classes*.dex' | strings)"
          for cls in libv2ray/Libv2ray hev/sockstun/TProxyService app/locman/LocmanVpnService; do
            grep -q "L$cls;" <<<"$dex" || { echo "::error::R8 удалил или переименовал $cls"; exit 1; }
          done
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee report/cert.txt
          mkdir -p dist
          cp "$APK" "dist/Locman-$VERSION-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Отчёт о сборке
        if: always()
        run: |
          tail -n 300 report/build.txt > report/build-tail.txt 2>/dev/null || true
          rm -f report/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report
          retention-days: 14

      # Отчёт и APK последней сборки — ещё и в ветку ci-build: их удобно забирать без входа в Actions.
      - name: Ветка ci-build
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-build"
          mkdir -p "$OUT"
          cp -r report "$OUT/" 2>/dev/null || true
          cp dist/*.apk "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-build
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-build && break
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: locman-apk
          path: dist/*.apk
          retention-days: 14

  windows:
    name: Windows (x64)
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/windows/') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия
        run: |
          source tools/ci_version.sh
          XRAY=$(grep -oE 'XRAY_LIB_VERSION:-v[0-9.]+' tools/fetch_natives.sh | sed 's/.*:-//')
          echo "XRAY=$XRAY" >> "$GITHUB_ENV"
          mkdir -p report
          { echo "Лоцман для Windows $VERSION ($CODE), Xray $XRAY"; flutter --version; } | tee report/versions.txt

      - name: Ядро Xray для Windows
        run: |
          mkdir -p xray-win
          curl -sSfL -o xray-win/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY}/Xray-windows-64.zip"
          tr -d '\r' < tools/xray-windows.sha256 | sha256sum -c
          (cd xray-win && 7z x -y xray.zip xray.exe wintun.dll LICENSE LICENSE-Wintun > /dev/null && rm xray.zip && ls -la)

      - name: Платформенные файлы Flutter
        run: |
          flutter create --org app --project-name locman --platforms windows .
          rm -f test/widget_test.dart
          python tools/patch_windows.py > report/windows-patch.txt 2>&1 || { cat report/windows-patch.txt; exit 1; }
          cp catalog/catalog.json assets/catalog.json
          python tools/changelog.py "$VERSION" release-notes/windows.txt

      - name: Сборка
        run: |
          set -o pipefail
          flutter build windows --release --build-name "$VERSION" --build-number "$CODE" \
            --dart-define=LOCMAN_VERSION="$VERSION" --dart-define=LOCMAN_CODE="$CODE" --dart-define=LOCMAN_XRAY="${XRAY#v}" \
            2>&1 | tee report/build.txt
          OUT=build/windows/x64/runner/Release
          cp xray-win/xray.exe xray-win/wintun.dll "$OUT/"
          cp xray-win/LICENSE "$OUT/LICENSE-Xray.txt"
          cp xray-win/LICENSE-Wintun "$OUT/LICENSE-Wintun.txt"
          cp LICENSE "$OUT/LICENSE-Locman.txt"
          ls -la "$OUT" | tee report/files.txt
          for f in locman.exe flutter_windows.dll xray.exe wintun.dll data/app.so; do
            [ -f "$OUT/$f" ] || { echo "::error::В сборке нет $f"; exit 1; }
          done

      - name: Установщик и архив
        run: |
          set -o pipefail
          mkdir -p dist
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; fi
          "$ISCC" //DAppVersion="$VERSION" //DSourceDir="$(cygpath -w "$PWD/build/windows/x64/runner/Release")" \
            //DOutDir="$(cygpath -w "$PWD/dist")" tools/locman.iss | tail -n 20 | tee report/installer.txt
          cp -r build/windows/x64/runner/Release build/windows/x64/runner/Locman
          powershell -NoProfile -Command "Compress-Archive -Path 'build\\windows\\x64\\runner\\Locman' -DestinationPath 'dist\\Locman-$VERSION-windows-x64-portable.zip' -Force"
          ls -la dist
          (cd dist && sha256sum * | tee ../report/sha256.txt)

      - name: Отчёт о сборке
        if: always()
        run: |
          tail -n 300 report/build.txt > report/build-tail.txt 2>/dev/null || true
          rm -f report/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows
          path: report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: locman-windows
          path: dist/*
          retention-days: 14

      - name: Ветка ci-build-win
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-build-win"
          mkdir -p "$OUT"
          cp -r report "$OUT/" 2>/dev/null || true
          cp dist/*setup.exe "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-build-win
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка Windows ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-build-win && break
            sleep 10
          done

  win7:
    name: Windows 7 (Лоцман Lite)
    if: ${{ !startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release/win7/') }}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        run: |
          source tools/ci_version.sh
          XRAY=$(grep -oE 'XRAY_LIB_VERSION:-v[0-9.]+' tools/fetch_natives.sh | sed 's/.*:-//')
          echo "XRAY=$XRAY" >> "$GITHUB_ENV"
          mkdir -p report7
          { echo "Лоцман Lite для Windows 7 $VERSION, Xray $XRAY (сборка win7)"; dotnet --info | head -20; } | tee report7/versions.txt

      - name: Ядро Xray для Windows 7
        run: |
          mkdir -p xray-win7
          curl -sSfL -o xray-win7/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY}/Xray-win7-64.zip"
          tr -d '\r' < tools/xray-win7.sha256 | sha256sum -c
          (cd xray-win7 && 7z x -y xray.zip xray.exe wintun.dll geoip.dat geosite.dat LICENSE LICENSE-Wintun > /dev/null && rm xray.zip && ls -la)

      - name: Сборка (.NET Framework 4.8)
        run: |
          set -o pipefail
          dotnet build windows7/Locman7.csproj -c Release -p:Version="$VERSION" -o out7 2>&1 | tee report7/build.txt
          cp xray-win7/xray.exe xray-win7/wintun.dll xray-win7/geoip.dat xray-win7/geosite.dat out7/
          cp xray-win7/LICENSE out7/LICENSE-Xray.txt
          cp xray-win7/LICENSE-Wintun out7/LICENSE-Wintun.txt
          cp LICENSE out7/LICENSE-Locman.txt
          rm -f out7/*.pdb
          ls -la out7 | tee report7/files.txt
          for f in Locman7.exe Locman7.exe.config xray.exe geoip.dat geosite.dat; do
            [ -f "out7/$f" ] || { echo "::error::В сборке нет $f"; exit 1; }
          done

      - name: Офлайн-установщик .NET Framework 4.8 и корневой сертификат Microsoft
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dotnet7 | Out-Null
          # Офлайн-установщик с серверов Microsoft (go.microsoft.com/fwlink/?linkid=2088631)
          Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/?linkid=2088631' -OutFile dotnet7\ndp48-x86-x64-allos-enu.exe
          $sig = Get-AuthenticodeSignature dotnet7\ndp48-x86-x64-allos-enu.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "Подпись установщика .NET не прошла проверку: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $size = (Get-Item dotnet7\ndp48-x86-x64-allos-enu.exe).Length
          if ($size -lt 100MB) { throw "Установщик .NET подозрительно мал: $size" }
          # Microsoft Root Certificate Authority 2011 — из хранилища сертификатов сборочной машины
          $root = Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq '8F43288AD272F3103B6FB1428485EA3014C0BCFE'
          if (-not $root) { throw 'Нет корневого сертификата Microsoft 2011' }
          Export-Certificate -Cert $root -FilePath dotnet7\MicrosoftRootCertificateAuthority2011.cer -Type CERT | Out-Null
          "ndp48: $size байт, подпись: $($sig.SignerCertificate.Subject)" | Tee-Object -Append report7\versions.txt
          (Get-FileHash dotnet7\ndp48-x86-x64-allos-enu.exe).Hash | Tee-Object -Append report7\versions.txt

      - name: Установщик и архив
        run: |
          set -o pipefail
          mkdir -p dist7
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; fi
          "$ISCC" //DAppVersion="$VERSION" //DSourceDir="$(cygpath -w "$PWD/out7")" \
            //DDotNetDir="$(cygpath -w "$PWD/dotnet7")" \
            //DOutDir="$(cygpath -w "$PWD/dist7")" tools/locman7.iss > report7/installer.txt
          head -n 3 report7/installer.txt; tail -n 5 report7/installer.txt
          mkdir -p pkg && cp -r out7 "pkg/Locman Lite"
          powershell -NoProfile -Command "Compress-Archive -Path 'pkg\\Locman Lite' -DestinationPath 'dist7\\Locman-Lite-$VERSION-win7-x64-portable.zip' -Force"
          ls -la dist7
          (cd dist7 && sha256sum * | tee ../report7/sha256.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-win7
          path: report7
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: locman-win7
          path: dist7/*
          retention-days: 14

  release:
    name: Релиз
    needs: [build, windows, win7]
    # Чужие платформы в выпуске пропущены (skipped) — это не ошибка.
    if: ${{ always() && startsWith(github.ref, 'refs/heads/release/') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    # Выпуски разных платформ пишут в одну ветку updates — по очереди.
    concurrency:
      group: release-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/ci_version.sh
          [ -n "$RELEASE" ] || { echo "::error::Ветка выпуска должна называться release/<android|windows|win7>/vX.Y.Z"; exit 1; }
          NOTES="release-notes/$PLATFORM.txt"
          [ -s "$NOTES" ] || { echo "::error::Нет заметок о выпуске: $NOTES"; exit 1; }
          mkdir -p dist prev
          for f in update.json update-windows.json update-win7.json; do
            curl -sSfL -o "prev/$f" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/updates/$f" || rm -f "prev/$f"
          done
          # Счёт версий общий: номер не меньше последнего выпущенного и больше прошлого выпуска этой платформы
          # (одну правку для двух платформ можно выпустить под одним номером).
          python3 - "$CODE" "$PLATFORM" <<'PY'
          import glob, json, os, sys
          code, platform = int(sys.argv[1]), sys.argv[2]
          codes = {os.path.basename(f): json.load(open(f, encoding="utf-8"))["versionCode"] for f in glob.glob("prev/*.json")}
          own = codes.get({"android": "update.json", "windows": "update-windows.json", "win7": "update-win7.json"}[platform], 0)
          top = max(codes.values() or [0])
          if code <= own or code < top:
              sys.exit(f"::error::Номер версии занят: у этой платформы уже {own}, последний общий {top}")
          PY
          case "$PLATFORM" in
            android)
              NAME="Лоцман для Android"
              cp art/locman-apk/*.apk dist/
              MAIN=$(ls dist/*.apk)
              CERT=$(grep -m1 'SHA-256' art/report/cert.txt | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
              HOW="Android (arm64): Locman-$VERSION-arm64-v8a.apk. Отпечаток сертификата подписи (SHA-256): $CERT" ;;
            windows)
              NAME="Лоцман для Windows 10/11"
              cp art/locman-windows/*setup.exe art/locman-windows/*portable.zip dist/
              MAIN=$(ls dist/*setup.exe)
              HOW="Windows 10/11: Locman-$VERSION-windows-x64-setup.exe (установщик) или Locman-$VERSION-windows-x64-portable.zip (без установки)." ;;
            win7)
              NAME="Лоцман Lite для Windows 7"
              cp art/locman-win7/*setup.exe art/locman-win7/*portable.zip dist/
              MAIN=$(ls dist/*setup.exe)
              HOW="Windows 7 SP1 (64 бит): Locman-Lite-$VERSION-win7-x64-setup.exe (установщик, .NET Framework 4.8 внутри) или Locman-Lite-$VERSION-win7-x64-portable.zip (без установки, нужен .NET Framework 4.8)." ;;
          esac
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 tools/make_update_json.py "$PLATFORM" "$VERSION" "$CODE" "$GITHUB_REPOSITORY" "$TAG" "$NOTES" prev json "$MAIN"
          {
            echo "Что нового:"
            sed 's/^/- /' "$NOTES"
            echo
            echo "$HOW"
            echo
            echo "Выпуски для других платформ — отдельно: https://github.com/$GITHUB_REPOSITORY/releases"
          } > NOTES.md
          gh release create "$TAG" --target "$GITHUB_SHA" dist/* json/*.json \
            --title "$NAME $VERSION" --notes-file NOTES.md --latest
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r json "$RUNNER_TEMP/json"
          git fetch --depth 1 origin updates && git checkout -B updates origin/updates || git checkout --orphan updates
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/json/*.json .
          git add update*.json
          git commit -m "Обновления: $TAG"
          git push origin HEAD:updates --force

  smoke:
    name: Проверка в эмуляторе
    # Эмулятор GitHub нестабилен под сетевой нагрузкой — запускаем вручную.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET_ABI: x86_64
      ABIS: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Кэш ядра и TUN-моста (x86_64)
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libv2ray.aar
            android/app/src/main/jniLibs
          key: natives-x86_64-${{ env.NDK_VERSION }}-${{ hashFiles('tools/fetch_natives.sh', 'tools/hev-udp-bind.patch', 'tools/natives.sha256') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро Xray и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_natives.sh

      - name: Ядро сверяется с закреплённой контрольной суммой (и из кэша тоже)
        run: sha256sum -c tools/natives.sha256

      - name: Сборка для эмулятора
        run: |
          flutter create --org app --project-name locman --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py > /dev/null
          cp catalog/catalog.json assets/catalog.json
          flutter build apk --release --target-platform android-x64 --build-name 0.0.${{ github.run_number }} --build-number ${{ github.run_number }}

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke_test.sh build/app/outputs/flutter-apk/app-release.apk smoke

      - name: Результаты в ветку ci-smoke
        if: always()
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-smoke"
          mkdir -p "$OUT"
          cp -r smoke/* "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-smoke
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Проверка ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-smoke && break
            sleep 10
          done
