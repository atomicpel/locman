name: Сборка

on:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'catalog/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then
            TAG="${GITHUB_REF_NAME#release/}"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "RELEASE=1" >> "$GITHUB_ENV"
            VERSION="${TAG#v}"
            IFS=. read -r MA MI PA <<<"$VERSION"
            CODE=$((MA * 10000 + MI * 100 + PA))
          else
            VERSION="0.0.${{ github.run_number }}"
            CODE=${{ github.run_number }}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          mkdir -p report
          { echo "Лоцман $VERSION ($CODE)"; flutter --version; java -version 2>&1; } | tee report/versions.txt

      - name: Кэш ядра и TUN-моста
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libv2ray.aar
            android/app/src/main/jniLibs
          key: natives-${{ env.NDK_VERSION }}-${{ hashFiles('tools/fetch_natives.sh', 'tools/hev-udp-bind.patch') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро Xray и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_natives.sh

      - name: Платформенные файлы Flutter
        run: |
          flutter create --org app --project-name locman --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py > report/gradle-patch.txt
          cp catalog/catalog.json assets/catalog.json
          python3 tools/changelog.py "$VERSION"

      - name: Анализ кода
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee report/analyze.txt

      - name: Тесты
        run: |
          set -o pipefail
          flutter test 2>&1 | tee report/tests.txt

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.LOCMAN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LOCMAN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LOCMAN_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "LOCMAN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Подпись: ключ релиза"
          else
            echo "Подпись: отладочный ключ (секретов нет)"
            if [ "${RELEASE:-}" = 1 ]; then echo "::error::Релиз без ключа подписи выпускать нельзя"; exit 1; fi
          fi

      - name: Сборка APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 \
            --build-name "$VERSION" --build-number "$CODE" 2>&1 | tee report/build.txt

      - name: Проверка APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -la "$APK"
          listing="$(unzip -l "$APK")"
          echo "$listing" | grep -E 'lib/' | awk '{print $1, $4}' | tee report/libs.txt
          for lib in libgojni.so libhev-socks5-tunnel.so libflutter.so libapp.so; do
            grep -q "lib/arm64-v8a/$lib" <<<"$listing" || { echo "::error::В APK нет $lib"; exit 1; }
          done
          dex="$(unzip -p "$APK" 'classes*.dex' | strings)"
          for cls in libv2ray/Libv2ray hev/sockstun/TProxyService app/locman/LocmanVpnService; do
            grep -q "L$cls;" <<<"$dex" || { echo "::error::R8 удалил или переименовал $cls"; exit 1; }
          done
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | tee report/cert.txt
          mkdir -p dist
          cp "$APK" "dist/Locman-$VERSION-arm64-v8a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Отчёт о сборке
        if: always()
        run: |
          tail -n 300 report/build.txt > report/build-tail.txt 2>/dev/null || true
          rm -f report/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report
          retention-days: 14

      # Отчёт и APK последней сборки — ещё и в ветку ci-build: их удобно забирать без входа в Actions.
      - name: Ветка ci-build
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-build"
          mkdir -p "$OUT"
          cp -r report "$OUT/" 2>/dev/null || true
          cp dist/*.apk "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-build
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-build && break
            sleep 10
          done

      - uses: actions/upload-artifact@v4
        with:
          name: locman-apk
          path: dist/*.apk
          retention-days: 14

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Версия
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/v* ]]; then
            TAG="${GITHUB_REF_NAME#release/}"
            VERSION="${TAG#v}"
            IFS=. read -r MA MI PA <<<"$VERSION"
            CODE=$((MA * 10000 + MI * 100 + PA))
          else
            VERSION="0.0.${{ github.run_number }}"
            CODE=${{ github.run_number }}
          fi
          XRAY=$(grep -oE 'XRAY_LIB_VERSION:-v[0-9.]+' tools/fetch_natives.sh | sed 's/.*:-//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "XRAY=$XRAY" >> "$GITHUB_ENV"
          mkdir -p report
          { echo "Лоцман для Windows $VERSION ($CODE), Xray $XRAY"; flutter --version; } | tee report/versions.txt

      - name: Ядро Xray для Windows
        run: |
          mkdir -p xray-win
          curl -sSfL -o xray-win/xray.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY}/Xray-windows-64.zip"
          (cd xray-win && 7z x -y xray.zip xray.exe wintun.dll LICENSE LICENSE-Wintun > /dev/null && rm xray.zip && ls -la)

      - name: Платформенные файлы Flutter
        run: |
          flutter create --org app --project-name locman --platforms windows .
          rm -f test/widget_test.dart
          python tools/patch_windows.py > report/windows-patch.txt 2>&1 || { cat report/windows-patch.txt; exit 1; }
          cp catalog/catalog.json assets/catalog.json
          python tools/changelog.py "$VERSION"

      - name: Сборка
        run: |
          set -o pipefail
          flutter build windows --release --build-name "$VERSION" --build-number "$CODE" \
            --dart-define=LOCMAN_VERSION="$VERSION" --dart-define=LOCMAN_CODE="$CODE" --dart-define=LOCMAN_XRAY="${XRAY#v}" \
            2>&1 | tee report/build.txt
          OUT=build/windows/x64/runner/Release
          cp xray-win/xray.exe xray-win/wintun.dll "$OUT/"
          cp xray-win/LICENSE "$OUT/LICENSE-Xray.txt"
          cp xray-win/LICENSE-Wintun "$OUT/LICENSE-Wintun.txt"
          cp LICENSE "$OUT/LICENSE-Locman.txt"
          ls -la "$OUT" | tee report/files.txt
          for f in locman.exe flutter_windows.dll xray.exe wintun.dll data/app.so; do
            [ -f "$OUT/$f" ] || { echo "::error::В сборке нет $f"; exit 1; }
          done

      - name: Установщик и архив
        run: |
          set -o pipefail
          mkdir -p dist
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress > /dev/null; fi
          "$ISCC" //DAppVersion="$VERSION" //DSourceDir="$(cygpath -w "$PWD/build/windows/x64/runner/Release")" \
            //DOutDir="$(cygpath -w "$PWD/dist")" tools/locman.iss | tail -n 20 | tee report/installer.txt
          cp -r build/windows/x64/runner/Release build/windows/x64/runner/Locman
          powershell -NoProfile -Command "Compress-Archive -Path 'build\\windows\\x64\\runner\\Locman' -DestinationPath 'dist\\Locman-$VERSION-windows-x64-portable.zip' -Force"
          ls -la dist
          (cd dist && sha256sum * | tee ../report/sha256.txt)

      - name: Отчёт о сборке
        if: always()
        run: |
          tail -n 300 report/build.txt > report/build-tail.txt 2>/dev/null || true
          rm -f report/build.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows
          path: report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: locman-windows
          path: dist/*
          retention-days: 14

      - name: Ветка ci-build-win
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-build-win"
          mkdir -p "$OUT"
          cp -r report "$OUT/" 2>/dev/null || true
          cp dist/*setup.exe "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-build-win
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сборка Windows ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-build-win && break
            sleep 10
          done

  release:
    name: Релиз
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          VERSION="${TAG#v}"
          IFS=. read -r MA MI PA <<<"$VERSION"
          CODE=$((MA * 10000 + MI * 100 + PA))
          mkdir -p dist
          cp art/locman-apk/*.apk dist/
          cp art/locman-windows/*setup.exe art/locman-windows/*portable.zip dist/
          (cd dist && sha256sum *.apk *.exe *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python3 tools/make_update_json.py "$VERSION" "$CODE" "$GITHUB_REPOSITORY" "$TAG" \
            release-notes.txt dist/*.apk dist/*setup.exe > dist/update.json
          cat dist/update.json
          CERT=$(grep -m1 'SHA-256' art/report/cert.txt | awk '{print toupper($NF)}' | sed 's/../&:/g; s/:$//')
          {
            echo "Что нового:"
            sed 's/^/- /' release-notes.txt
            echo
            echo "Android (Poco X7 Pro и другие на arm64): Locman-$VERSION-arm64-v8a.apk."
            echo "Windows 10/11: Locman-$VERSION-windows-x64-setup.exe (установщик) или Locman-$VERSION-windows-x64-portable.zip (без установки)."
            echo
            echo "Отпечаток сертификата подписи APK (SHA-256): $CERT"
          } > dist/NOTES.md
          gh release create "$TAG" --target "$GITHUB_SHA" dist/*.apk dist/*.exe dist/*.zip dist/SHA256SUMS.txt dist/update.json \
            --title "Лоцман $VERSION" --notes-file dist/NOTES.md --latest
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp dist/update.json "$RUNNER_TEMP/update.json"
          git fetch --depth 1 origin updates && git checkout -B updates origin/updates || git checkout --orphan updates
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP/update.json" update.json
          git add update.json
          git commit -m "update.json для $TAG"
          git push origin HEAD:updates --force

  smoke:
    name: Проверка в эмуляторе
    # Эмулятор GitHub нестабилен под сетевой нагрузкой — запускаем вручную.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TARGET_ABI: x86_64
      ABIS: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Кэш ядра и TUN-моста (x86_64)
        id: natives
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libv2ray.aar
            android/app/src/main/jniLibs
          key: natives-x86_64-${{ env.NDK_VERSION }}-${{ hashFiles('tools/fetch_natives.sh', 'tools/hev-udp-bind.patch') }}

      - name: NDK
        if: steps.natives.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Ядро Xray и TUN-мост
        if: steps.natives.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_natives.sh

      - name: Сборка для эмулятора
        run: |
          flutter create --org app --project-name locman --platforms android .
          rm -f test/widget_test.dart
          python3 tools/patch_android.py > /dev/null
          cp catalog/catalog.json assets/catalog.json
          flutter build apk --release --target-platform android-x64 --build-name 0.0.${{ github.run_number }} --build-number ${{ github.run_number }}

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Запуск в эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke_test.sh build/app/outputs/flutter-apk/app-release.apk smoke

      - name: Результаты в ветку ci-smoke
        if: always()
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ci-smoke"
          mkdir -p "$OUT"
          cp -r smoke/* "$OUT/" 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > "$OUT/STATUS"
          cd "$OUT"
          git init -q -b ci-smoke
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Проверка ${{ github.run_number }}"
          for i in 1 2 3; do
            git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-smoke && break
            sleep 10
          done
